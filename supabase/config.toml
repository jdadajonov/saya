[project]
id = "saya"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "exp://192.168.1.16:8082"
additional_redirect_urls = ["exp://192.168.1.16:8082", "exp://localhost:8081", "exp://localhost:8082", "saya://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.evidence]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[analytics]
enabled = false
